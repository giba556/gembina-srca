name: Build Gembina Srca

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Forge MDK (1.20.0)
        run: |
          set -e
          MDK_URL="https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.0-56.1.0/forge-1.20.0-56.1.0-mdk.zip"
          echo "Downloading $MDK_URL"
          curl -fLS --retry 3 --retry-delay 5 "$MDK_URL" -o forge-mdk.zip
          file forge-mdk.zip || true
          unzip -t forge-mdk.zip
          unzip -q forge-mdk.zip -d mdk
          ls -la mdk

      - name: Copy mod source into MDK
        run: |
          mkdir -p mdk/src/main
          if [ -d "src" ]; then
            cp -r src mdk/ || true
          fi
          mkdir -p mdk/src/main/resources
          if [ -d "src/main/resources" ]; then
            cp -r src/main/resources/* mdk/src/main/resources/ || true
          fi
          ls -R mdk/src || true

      - name: Build (Gradle)
        working-directory: mdk
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon build -x test || ./gradlew --no-daemon build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gembinasrca-jar
          path: mdk/build/libs/*.jar
